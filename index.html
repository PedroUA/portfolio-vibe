<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Pedro Lemos — Multimedia Artist, UI/UX Designer, Game Designer. Portfolio showcasing creative work across multiple disciplines.">
  <title>Pedro Lemos — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="page-landing">

  <div class="viewport-wrapper" id="viewport-wrapper">
    <div class="landing-canvas" id="landing-canvas">

      <!-- Top Navigation Header -->
      <header class="top-nav" id="top-nav">
        <nav class="nav-links">
          <a href="portfolio.html" class="nav-link">Portfolio</a>
          <a href="about.html" class="nav-link">About</a>
          <a href="mailto:pedrotlemos@hotmail.com" class="nav-link" id="nav-contact">Contact</a>
        </nav>
      </header>

      <!-- Main Layout Grid -->
      <main class="main-layout" id="main-layout">
        
        <!-- Left Photo Column (Aspect Ratio Maintained) -->
        <div class="photo-column" id="photo-column">
          <div class="photo-wrapper" id="photo-wrapper">
            <img
              src="photo.png"
              alt="Pedro Lemos portrait"
              class="photo-img photo-default"
              id="photo-default"
            />
            <img
              src="assets/PhotoMe_Hover.png"
              alt="Pedro Lemos portrait hover"
              class="photo-img photo-hover"
              id="photo-hover"
            />
          </div>
        </div>

        <!-- Unified Content Block: Portfolio + Pedro Lemos + Skills -->
        <div class="content-group" id="content-group">
          <!-- Portfolio Label -->
          <span class="label-portfolio" id="label-portfolio">Portfolio</span>
          
          <!-- Pedro Lemos Name -->
          <h1 class="hero-name" id="hero-name">Pedro Lemos</h1>
          
          <!-- Skills List (Aggregated directly under Pedro Lemos) -->
          <div class="skills-block" id="skills-block">
            <p class="skill-item skill--primary" id="skill-multimedia">Multimedia Graduate</p>
            <p class="skill-item skill--sub1" id="skill-uiux">UI/UX Design</p>
            <p class="skill-item skill--sub2" id="skill-sound">Sound Design</p>
            <p class="skill-item skill--sub3" id="skill-game">Game Design</p>
            <p class="skill-item skill--sub4" id="skill-3d">3D Modeling</p>
          </div>
        </div>

      </main>

      <!-- Right Accent Dark Bar (Maintained on all pages) -->
      <aside class="right-accent-bar" id="right-accent-bar"></aside>

    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
